[package]
name    = "kangaroo"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "kangaroo"
path = "src/main.rs"

[dependencies]
clap   = { version = "4", features = ["derive"] }
hex    = "0.4"
rayon  = "1.10"

[features]
cuda = []

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
