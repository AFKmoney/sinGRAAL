# sinGRAAL v13 — Distributed Pool: Coordinator + Workers
#
# Usage:
#   1. Exporter les variables :
#        export TARGET_X=<64 hex chars>   # x-coord clé publique puzzle #135
#        export TARGET_Y=<64 hex chars>   # y-coord
#        export CUDA_ARCH=sm_89           # sm_80=A100, sm_89=RTX4090, sm_90=H100
#
#   2. Build :
#        docker compose build
#
#   3. Lancer :
#        docker compose up -d
#
#   4. Scaler (8 GPUs sur la même machine) :
#        docker compose up -d --scale worker=8

version: "3.9"

x-worker-base: &worker-base
  build:
    context: ../singraal
    dockerfile: Dockerfile
    args:
      CUDA_ARCH: ${CUDA_ARCH:-sm_80}
  image: singraal:v13-${CUDA_ARCH:-sm80}
  environment:
    TARGET_X: ${TARGET_X:?TARGET_X requis}
    TARGET_Y: ${TARGET_Y:?TARGET_Y requis}
    RANGE_BITS: ${RANGE_BITS:-135}
    NUM_ANIMALS: ${NUM_ANIMALS:-262144}
    COORDINATOR: coordinator:5135
  volumes:
    - checkpoints:/data
  restart: unless-stopped
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            capabilities: [gpu]
  depends_on:
    coordinator:
      condition: service_healthy

services:
  # ── Coordinateur — table DP globale ───────────────────────────────────────
  coordinator:
    build:
      context: ../singraal
      dockerfile: Dockerfile
      args:
        CUDA_ARCH: ${CUDA_ARCH:-sm_80}
    image: singraal:v13-${CUDA_ARCH:-sm80}
    environment:
      TARGET_X: ${TARGET_X:?TARGET_X requis}
      TARGET_Y: ${TARGET_Y:?TARGET_Y requis}
      RANGE_BITS: ${RANGE_BITS:-135}
      SERVE: "1"
      BIND: "0.0.0.0:5135"
      CHECKPOINT: /data/coordinator.ckpt
    ports:
      - "5135:5135"
    volumes:
      - checkpoints:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/localhost/5135"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # ── Workers GPU (un par carte) ────────────────────────────────────────────
  worker-0:
    <<: *worker-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      TARGET_X: ${TARGET_X}
      TARGET_Y: ${TARGET_Y}
      RANGE_BITS: ${RANGE_BITS:-135}
      NUM_ANIMALS: ${NUM_ANIMALS:-262144}
      COORDINATOR: coordinator:5135

  worker-1:
    <<: *worker-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    environment:
      TARGET_X: ${TARGET_X}
      TARGET_Y: ${TARGET_Y}
      RANGE_BITS: ${RANGE_BITS:-135}
      NUM_ANIMALS: ${NUM_ANIMALS:-262144}
      COORDINATOR: coordinator:5135

  worker-2:
    <<: *worker-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    environment:
      TARGET_X: ${TARGET_X}
      TARGET_Y: ${TARGET_Y}
      RANGE_BITS: ${RANGE_BITS:-135}
      NUM_ANIMALS: ${NUM_ANIMALS:-262144}
      COORDINATOR: coordinator:5135

  worker-3:
    <<: *worker-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    environment:
      TARGET_X: ${TARGET_X}
      TARGET_Y: ${TARGET_Y}
      RANGE_BITS: ${RANGE_BITS:-135}
      NUM_ANIMALS: ${NUM_ANIMALS:-262144}
      COORDINATOR: coordinator:5135

volumes:
  checkpoints:
    driver: local
