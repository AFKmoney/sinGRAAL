[package]
name    = "bsgs2d"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "bsgs2d"
path = "src/main.rs"

[dependencies]
clap    = { version = "4", features = ["derive"] }
hex     = "0.4"
num-bigint  = "0.4"
num-traits  = "0.2"
num-integer = "0.1"
num-rational = "0.4"

[features]
cuda = []

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
